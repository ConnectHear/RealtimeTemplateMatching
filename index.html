<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Template Matching (JS)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        #container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        video, canvas { border: 1px solid black; max-width: 100%; height: auto; background-color: #ddd; }
        #status { margin-top: 10px; font-weight: bold; }
        #fps { position: absolute; top: 30px; right: 30px; background-color: rgba(0,0,0,0.5); color: white; padding: 5px 10px; border-radius: 3px; }
        button { padding: 10px 15px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Real-time Template Matching (OpenCV.js)</h1>

    <div id="container">
        <p>Loading OpenCV.js and initializing...</p>
        <video id="videoInput" width="640" height="480" style="display: none;"></video>
        <canvas id="canvasOutput" width="640" height="480"></canvas>
        <div id="status">Status: Initializing</div>
        <div id="fps">FPS: 0.00</div>
        <button id="startButton" disabled>Start Webcam</button>
    </div>

    <!-- Load the template matcher utility -->
    <script src="templateMatcher.js"></script>
    <!-- Load the main application logic -->
    <script src="main.js"></script>
    <!-- Load OpenCV.js -->
    <!-- The loadOpenCv function in templateMatcher.js will handle adding the script tag -->

</body>
</html>
